<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPTNEETPGHUB — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp,
    getDoc, updateDoc, query, where, orderBy, limit, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC19L8F1NV-akV-2pWswnwh67RIQmzcCwY",
    authDomain: "pptneetpghub.firebaseapp.com",
    projectId: "pptneetpghub",
    storageBucket: "pptneetpghub.firebasestorage.app",
    messagingSenderId: "75959705573",
    appId: "1:75959705573:web:f1b9ffcdb712fe2820190c",
    measurementId: "G-0JCWHXMBWN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.__fb = {
    auth, db, provider, signInWithPopup, signOut, onAuthStateChanged,
    collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp,
    getDoc, updateDoc, query, where, orderBy, limit, writeBatch
  };
  window.dispatchEvent(new Event('fbReady'));
</script>
<style>
  :root {
    --ink: #141A22;
    --paper: #FCFAF6;
    --paper-alt: #F3F6F4;
    --teal-deep: #074A40;
    --teal: #0E8270;
    --teal-tint: #E4F2EE;
    --gold: #B28218;
    --gold-tint: #FFF8E8;
    --gray: #6E7A8A;
    --border: #DEE5EB;
    --white: #FFFFFF;
    --red: #B5352E;
    --red-tint: #FBEAE9;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; border: none; }

  .site-header {
    background: var(--teal-deep);
    padding: 16px 24px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 10px rgba(7, 74, 64, 0.18);
  }
  .brand { font-weight: 800; font-size: 18px; color: var(--paper); }
  .brand span { color: #E8C378; }
  .account-pill {
    background: var(--teal);
    color: var(--white);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

  .gate {
    text-align: center;
    padding: 80px 20px;
  }
  .gate h2 { font-size: 20px; margin-bottom: 8px; }
  .gate p { color: var(--gray); font-size: 14px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .tab-btn.active { background: var(--teal-deep); color: var(--white); border-color: var(--teal-deep); }

  .card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .card h3 { margin: 0 0 16px; font-size: 16px; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--gray); margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="email"], select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14.5px;
    background: var(--paper-alt);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 70px; }

  .btn {
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    background: var(--teal);
    margin-top: 16px;
  }
  .btn.danger { background: var(--red); }
  .btn.secondary { background: var(--paper-alt); color: var(--ink); border: 1.5px solid var(--border); }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .meta { font-size: 13px; color: var(--gray); }
  .list-item .title { font-weight: 600; font-size: 14.5px; }
  .del-btn {
    background: var(--red-tint);
    color: var(--red);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: var(--teal-deep); color: var(--white);
    padding: 13px 22px; border-radius: 12px; font-size: 14px; font-weight: 500;
    display: none; z-index: 200;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show { display: block; }
  .toast.error { background: var(--red); }

  .empty { text-align: center; color: var(--gray); padding: 30px 0; font-size: 14px; }
  .pay-row {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .pay-row:last-child { margin-bottom: 0; }
  .pay-row .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .pay-row .who { font-weight: 600; font-size: 14.5px; word-break: break-word; }
  .pay-row .amt { font-weight: 800; color: var(--teal-deep); font-size: 16px; flex-shrink: 0; }
  .pay-row .mail { font-size: 13px; color: var(--gray); word-break: break-all; margin-top: 2px; }
  .pay-row .utr-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pay-row .utr {
    background: var(--gold-tint); border: 1px solid var(--gold); color: #8A6A1A;
    border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
    user-select: all; -webkit-user-select: all;
  }
  .pay-row .when { font-size: 12px; color: var(--gray); margin-top: 8px; }
  .pay-row .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn.mini { margin-top: 0; padding: 9px 16px; font-size: 13px; }
  .copy-btn {
    background: var(--teal-tint); color: var(--teal-deep);
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  }
  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 12px; flex-shrink: 0;
  }
  .badge.approved { background: var(--teal-tint); color: var(--teal-deep); }
  .badge.rejected { background: var(--red-tint); color: var(--red); }
  .price-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .price-row input { max-width: 140px; }
  .price-row .btn { margin-top: 0; }
  .hint { font-size: 12.5px; color: var(--gray); margin: 10px 0 0; }
  input[type="number"] {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14.5px; background: var(--paper-alt); color: var(--ink);
  }
  .tab-count {
    background: var(--gold); color: var(--white); border-radius: 10px;
    font-size: 11.5px; padding: 1px 7px; margin-left: 6px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">PPTNEETPGHUB <span>·</span> Admin</div>
  <button class="account-pill" id="accountBtn">Sign in</button>
</header>

<div class="wrap">

  <div class="gate" id="notAdminGate" style="display:block;">
    <h2>Admins only</h2>
    <p>Sign in with the admin account to manage content and members.</p>
  </div>

  <div id="adminArea" style="display:none;">

    <div class="tabs">
      <button class="tab-btn active" data-panel="paymentsPanel">Payments<span class="tab-count" id="pendingCount" style="display:none;">0</span></button>
      <button class="tab-btn" data-panel="resourcesPanel">Add Resource</button>
      <button class="tab-btn" data-panel="membersPanel">Members</button>
      <button class="tab-btn" data-panel="listPanel">All Resources</button>
    </div>

    <!-- Payments -->
    <div id="paymentsPanel">
      <div class="card">
        <h3>Premium price</h3>
        <div class="price-row">
          <input type="number" id="priceInput" min="1" step="1" placeholder="500">
          <button class="btn" id="savePriceBtn">Save price</button>
        </div>
        <p class="hint" id="priceHint">Shown to new buyers on the site.</p>
      </div>

      <div class="card">
        <h3>Pending payments</h3>
        <div id="pendingList"><div class="empty">Loading…</div></div>
      </div>

      <div class="card">
        <h3>Recently reviewed</h3>
        <div id="historyList"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <!-- Add Resource -->
    <div class="card" id="resourcesPanel" style="display:none;">
      <h3>Add a resource</h3>

      <label>Subject</label>
      <input type="text" id="r_subject" placeholder="e.g. Surgery, Anatomy">

      <label>Tab</label>
      <select id="r_tab">
        <option>High Yield</option>
        <option>PYQs</option>
        <option>PYTs</option>
        <option>Tests</option>
        <option>Flashcards</option>
      </select>

      <label>Title</label>
      <input type="text" id="r_title" placeholder="e.g. Surgery High Yield Notes">

      <label>Meta line</label>
      <input type="text" id="r_meta" placeholder="e.g. Exam-focused summary · 24 pages">

      <label>Type</label>
      <select id="r_type">
        <option value="view">View (PDFs, tests — no download)</option>
        <option value="download">Download (flashcards)</option>
      </select>

      <label>File URL (optional for now)</label>
      <input type="text" id="r_fileUrl" placeholder="Paste the R2/file link once you have one">

      <button class="btn" id="addResourceBtn">Add resource</button>
    </div>

    <!-- Members -->
    <div class="card" id="membersPanel" style="display:none;">
      <h3>Grant premium access</h3>
      <label>Buyer's email (the one they'll sign in with)</label>
      <input type="email" id="m_email" placeholder="buyer@gmail.com">
      <label>Note (optional, for your own records)</label>
      <input type="text" id="m_note" placeholder="e.g. paid 500 on 1 Oct, UTR 123456">
      <button class="btn" id="addMemberBtn">Grant access</button>

      <h3 style="margin-top:28px;">Current members</h3>
      <div id="membersList"><div class="empty">Loading…</div></div>
    </div>

    <!-- All resources -->
    <div class="card" id="listPanel" style="display:none;">
      <h3>All resources</h3>
      <div id="resourcesList"><div class="empty">Loading…</div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_EMAIL = "devid.vachhani11@gmail.com";
let currentUser = null;

window.addEventListener('fbReady', () => {
  const { auth, provider, signInWithPopup, signOut, onAuthStateChanged } = window.__fb;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    updateUI();
    if (isAdmin()) {
      loadResourcesList();
      loadMembersList();
      loadPayments();
      loadPrice();
    }
  });

  document.getElementById('accountBtn').addEventListener('click', async () => {
    if (currentUser) {
      await signOut(auth);
    } else {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        showToast('Sign-in failed. Try again.', true);
      }
    }
  });

  document.getElementById('addResourceBtn').addEventListener('click', addResource);
  document.getElementById('addMemberBtn').addEventListener('click', addMember);
  document.getElementById('savePriceBtn').addEventListener('click', savePrice);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['paymentsPanel', 'resourcesPanel', 'membersPanel', 'listPanel'].forEach(id => {
        document.getElementById(id).style.display = (id === btn.dataset.panel) ? 'block' : 'none';
      });
    });
  });
});

function isAdmin() {
  return currentUser && currentUser.email && currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

function updateUI() {
  const btn = document.getElementById('accountBtn');
  const gate = document.getElementById('notAdminGate');
  const area = document.getElementById('adminArea');

  if (currentUser) {
    btn.textContent = 'Sign out';
    if (isAdmin()) {
      gate.style.display = 'none';
      area.style.display = 'block';
    } else {
      gate.style.display = 'block';
      area.style.display = 'none';
    }
  } else {
    btn.textContent = 'Sign in';
    gate.style.display = 'block';
    area.style.display = 'none';
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------- Resources ----------
async function addResource() {
  const { db, collection, addDoc, serverTimestamp } = window.__fb;
  const subject = document.getElementById('r_subject').value.trim();
  const tab = document.getElementById('r_tab').value;
  const title = document.getElementById('r_title').value.trim();
  const meta = document.getElementById('r_meta').value.trim();
  const type = document.getElementById('r_type').value;
  const fileUrl = document.getElementById('r_fileUrl').value.trim();

  if (!subject || !title) {
    showToast('Subject and Title are required.', true);
    return;
  }

  try {
    await addDoc(collection(db, "resources"), {
      subject, tab, title, meta, type, fileUrl: fileUrl || null,
      createdAt: serverTimestamp()
    });
    showToast('Resource added: ' + title);
    document.getElementById('r_subject').value = '';
    document.getElementById('r_title').value = '';
    document.getElementById('r_meta').value = '';
    document.getElementById('r_fileUrl').value = '';
    loadResourcesList();
  } catch (e) {
    showToast('Failed to add resource: ' + e.message, true);
  }
}

async function loadResourcesList() {
  const { db, collection, getDocs } = window.__fb;
  const el = document.getElementById('resourcesList');
  try {
    const snap = await getDocs(collection(db, "resources"));
    if (snap.empty) {
      el.innerHTML = '<div class="empty">No resources added yet.</div>';
      return;
    }
    el.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `
        <div>
          <div class="title">${data.title || 'Untitled'}</div>
          <div class="meta">${data.subject || '—'} · ${data.tab || '—'} · ${data.type || '—'}</div>
        </div>
        <button class="del-btn" data-id="${d.id}">Delete</button>
      `;
      row.querySelector('.del-btn').addEventListener('click', () => deleteResource(d.id));
      el.appendChild(row);
    });
  } catch (e) {
    el.innerHTML = '<div class="empty">Could not load resources.</div>';
  }
}

async function deleteResource(id) {
  const { db, doc, deleteDoc } = window.__fb;
  if (!confirm('Delete this resource?')) return;
  try {
    await deleteDoc(doc(db, "resources", id));
    showToast('Resource deleted.');
    loadResourcesList();
  } catch (e) {
    showToast('Failed to delete: ' + e.message, true);
  }
}

// ---------- Members ----------
async function addMember() {
  const { db, doc, setDoc, serverTimestamp } = window.__fb;
  const email = document.getElementById('m_email').value.trim().toLowerCase();
  const note = document.getElementById('m_note').value.trim();

  if (!email || !email.includes('@')) {
    showToast('Enter a valid email.', true);
    return;
  }

  try {
    await setDoc(doc(db, "members", email), {
      note: note || '',
      addedAt: serverTimestamp()
    });
    showToast('Access granted: ' + email);
    document.getElementById('m_email').value = '';
    document.getElementById('m_note').value = '';
    loadMembersList();
  } catch (e) {
    showToast('Failed to grant access: ' + e.message, true);
  }
}

async function loadMembersList() {
  const { db, collection, getDocs } = window.__fb;
  const el = document.getElementById('membersList');
  try {
    const snap = await getDocs(collection(db, "members"));
    window._memberCount = snap.size;
    updatePriceHint();
    if (snap.empty) {
      el.innerHTML = '<div class="empty">No members yet.</div>';
      return;
    }
    el.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `
        <div>
          <div class="title">${d.id}</div>
          <div class="meta">${data.note || 'No note'}</div>
        </div>
        <button class="del-btn" data-id="${d.id}">Revoke</button>
      `;
      row.querySelector('.del-btn').addEventListener('click', () => revokeMember(d.id));
      el.appendChild(row);
    });
  } catch (e) {
    el.innerHTML = '<div class="empty">Could not load members.</div>';
  }
}

async function revokeMember(email) {
  const { db, doc, deleteDoc } = window.__fb;
  if (!confirm('Revoke access for ' + email + '?')) return;
  try {
    await deleteDoc(doc(db, "members", email));
    showToast('Access revoked: ' + email);
    loadMembersList();
  } catch (e) {
    showToast('Failed to revoke: ' + e.message, true);
  }
}
// ---------- Payments ----------
function mk(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent: buyer-entered text can never run as HTML
  return n;
}

function fmtTime(ts) {
  try { return ts && ts.toDate ? ts.toDate().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; }
  catch (e) { return '—'; }
}

function updatePriceHint() {
  const hint = document.getElementById('priceHint');
  if (!hint) return;
  const n = window._memberCount;
  hint.textContent = (typeof n === 'number')
    ? 'Shown to new buyers on the site. Members so far: ' + n + '.'
    : 'Shown to new buyers on the site.';
}

async function loadPrice() {
  const { db, doc, getDoc } = window.__fb;
  const input = document.getElementById('priceInput');
  try {
    const snap = await getDoc(doc(db, "config", "pricing"));
    input.value = (snap.exists() && snap.data().price) ? snap.data().price : 500;
  } catch (e) {
    input.value = 500;
  }
}

async function savePrice() {
  const { db, doc, setDoc, serverTimestamp } = window.__fb;
  const price = parseInt(document.getElementById('priceInput').value, 10);
  if (!price || price < 1) {
    showToast('Enter a valid price.', true);
    return;
  }
  try {
    await setDoc(doc(db, "config", "pricing"), { price, updatedAt: serverTimestamp() });
    showToast('Price saved: ₹' + price);
  } catch (e) {
    showToast('Failed to save price: ' + e.message, true);
  }
}

function paymentRow(id, p, withActions) {
  const row = mk('div', 'pay-row');

  const top = mk('div', 'top');
  top.appendChild(mk('div', 'who', p.name || '(no name)'));
  top.appendChild(mk('div', 'amt', '₹' + (p.amount != null ? p.amount : '—')));
  row.appendChild(top);
  row.appendChild(mk('div', 'mail', p.email || '—'));

  const utrLine = mk('div', 'utr-line');
  utrLine.appendChild(mk('span', 'utr', id));
  const copy = mk('button', 'copy-btn', 'Copy UTR');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(id); showToast('UTR copied'); }
    catch (e) { showToast('Press and hold the UTR to copy', true); }
  });
  utrLine.appendChild(copy);
  if (!withActions) {
    utrLine.appendChild(mk('span', 'badge ' + p.status, p.status === 'approved' ? 'Approved' : 'Rejected'));
  }
  row.appendChild(utrLine);
  row.appendChild(mk('div', 'when', 'Submitted ' + fmtTime(p.createdAt)));

  if (withActions) {
    const actions = mk('div', 'actions');
    const ok = mk('button', 'btn mini', 'Approve');
    ok.addEventListener('click', () => approvePayment(id, p));
    const no = mk('button', 'btn mini danger', 'Reject');
    no.addEventListener('click', () => rejectPayment(id, p));
    actions.appendChild(ok);
    actions.appendChild(no);
    row.appendChild(actions);
  }
  return row;
}

async function loadPayments() {
  const { db, collection, getDocs, query, where, orderBy, limit } = window.__fb;
  const pendingEl = document.getElementById('pendingList');
  const historyEl = document.getElementById('historyList');
  const countEl = document.getElementById('pendingCount');

  try {
    const pSnap = await getDocs(query(collection(db, "payments"), where("status", "==", "pending")));
    const pending = [];
    pSnap.forEach(d => pending.push({ id: d.id, data: d.data() }));
    pending.sort((a, b) => ((a.data.createdAt && a.data.createdAt.toMillis()) || 0) - ((b.data.createdAt && b.data.createdAt.toMillis()) || 0));

    pendingEl.innerHTML = '';
    if (!pending.length) {
      pendingEl.innerHTML = '<div class="empty">No pending payments.</div>';
    } else {
      pending.forEach(x => pendingEl.appendChild(paymentRow(x.id, x.data, true)));
    }
    countEl.textContent = pending.length;
    countEl.style.display = pending.length ? 'inline-block' : 'none';
  } catch (e) {
    pendingEl.innerHTML = '<div class="empty">Could not load payments.</div>';
  }

  try {
    const hSnap = await getDocs(query(collection(db, "payments"), orderBy("createdAt", "desc"), limit(40)));
    historyEl.innerHTML = '';
    let shown = 0;
    hSnap.forEach(d => {
      const data = d.data();
      if (data.status === 'pending') return;
      historyEl.appendChild(paymentRow(d.id, data, false));
      shown++;
    });
    if (!shown) historyEl.innerHTML = '<div class="empty">Nothing reviewed yet.</div>';
  } catch (e) {
    historyEl.innerHTML = '<div class="empty">Could not load history.</div>';
  }
}

async function approvePayment(utr, p) {
  const { db, doc, writeBatch, serverTimestamp } = window.__fb;
  const email = (p.email || '').toLowerCase();
  if (!email.includes('@')) { showToast('This payment has no valid email.', true); return; }
  if (!confirm('Check UTR ' + utr + ' (₹' + p.amount + ') in your UPI app first.\n\nApprove and give premium access to ' + email + '?')) return;
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, "payments", utr), { status: 'approved', reviewedAt: serverTimestamp() });
    batch.set(doc(db, "members", email), {
      note: 'Paid ₹' + p.amount + ' · UTR ' + utr,
      utr: utr,
      amount: p.amount,
      addedAt: serverTimestamp()
    });
    await batch.commit();
    showToast('Approved: ' + email);
    loadPayments();
    loadMembersList();
  } catch (e) {
    showToast('Failed to approve: ' + e.message, true);
  }
}

async function rejectPayment(utr, p) {
  const { db, doc, updateDoc, serverTimestamp } = window.__fb;
  if (!confirm('Reject UTR ' + utr + '? The buyer will be asked to check the number and submit again.')) return;
  try {
    await updateDoc(doc(db, "payments", utr), { status: 'rejected', reviewedAt: serverTimestamp() });
    showToast('Rejected: ' + utr);
    loadPayments();
  } catch (e) {
    showToast('Failed to reject: ' + e.message, true);
  }
}
</script>
